[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "audio-deepfake-detector"
version = "1.0.0"
description = "Production-grade audio deepfake & voice clone detection system"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.36.0",
    "onnxruntime>=1.17.0",
    "onnx>=1.15.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "librosa>=0.10.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "soundfile>=0.12.1",
    "Pillow>=10.1.0",
]

[tool.setuptools.packages.find]
where = ["app"]
